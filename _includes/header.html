<header class="site-header">
  <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav aria-label="Main">
    {% for link in site.data.navigation.main %}
      {% assign current = false %}
      {% if page.url == link.url %}{% assign current = true %}{% endif %}
      {% if link.url == '/' and page.layout == 'home' %}{% assign current = true %}{% endif %}
      <a href="{{ link.url | relative_url }}"{% if current %} aria-current="page"{% endif %}>{{ link.title }}</a>
    {% endfor %}
  </nav>
</header>
