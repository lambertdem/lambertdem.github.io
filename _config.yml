# Site settings. Restart `jekyll serve` after editing this file.

title       : "Lambert De Monte"
description : "Statistician working on extreme value theory and the modelling of rare multivariate events."
url         : "https://lambertdem.github.io"
baseurl     : ""
locale      : "en_GB"
lang        : "en"

author:
  name          : "Lambert De Monte"
  avatar        : "LDM.jpg"
  email         : "l.demonte@ed.ac.uk"
  googlescholar : "https://scholar.google.com/citations?user=HMIbGeoAAAAJ&hl=fr"
  github        : "lambertdem"
  cv            : "/files/CV_LDM.pdf"

# Publication groups, shown on the home page in this order.
# Each publication's `category` must match one of these keys.
publication_category:
  books:
    title: "Books"
  preprints:
    title: "Preprints"
  manuscripts:
    title: "Journal articles"
  conferences:
    title: "Conference papers"
  vulgarisation:
    title: "Science communication"
  other:
    title: "Other writing"
  thesis:
    title: "Thesis"

collections:
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope: { path: "", type: pages }
    values: { layout: page }
  - scope: { path: "", type: publications }
    values: { layout: publication }

include:
  - _pages
  - files

exclude:
  - Deleted
  - CONTRIBUTING.md
  - README.md
  - LICENSE
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - vendor
  - .devcontainer
  - .github

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

future: true
timezone: Etc/UTC

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-seo-tag
